name: Build macOS App

# Trigger: when a version tag (e.g. v1.0.0) is pushed
on:
  push:
    tags:
      - "v*"
  # Also allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write  # needed to upload assets to the release

jobs:
  build-mac:
    runs-on: macos-latest
    timeout-minutes: 30

    strategy:
      matrix:
        arch: [x64, arm64]

    steps:
      # ---- Checkout ----
      - name: Checkout code
        uses: actions/checkout@v4

      # ---- Node.js ----
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ---- pnpm ----
      - name: Install pnpm
        run: npm install -g pnpm@10.4.1

      # ---- Dependencies ----
      - name: Install dependencies
        run: pnpm install

      # ---- Download static FFmpeg binaries ----
      - name: Download static FFmpeg and FFprobe binaries
        run: |
          ARCH="${{ matrix.arch }}"
          TARGET_DIR="electron/bin/mac/${ARCH}"
          mkdir -p "$TARGET_DIR"

          echo "Downloading static FFmpeg binaries for macOS ${ARCH}..."

          # Download from descriptinc/ffmpeg-ffprobe-static (truly static, no deps)
          RELEASE_BASE="https://github.com/descriptinc/ffmpeg-ffprobe-static/releases/download/b6.1.2-rc.1"

          curl -fsSL -o "$TARGET_DIR/ffmpeg" "${RELEASE_BASE}/ffmpeg-darwin-${ARCH}"
          curl -fsSL -o "$TARGET_DIR/ffprobe" "${RELEASE_BASE}/ffprobe-darwin-${ARCH}"

          chmod +x "$TARGET_DIR/ffmpeg" "$TARGET_DIR/ffprobe"

          # Remove quarantine attribute (macOS security)
          xattr -cr "$TARGET_DIR/ffmpeg" 2>/dev/null || true
          xattr -cr "$TARGET_DIR/ffprobe" 2>/dev/null || true

          # Ad-hoc sign the binaries (required for Apple Silicon)
          codesign -s - "$TARGET_DIR/ffmpeg" 2>/dev/null || true
          codesign -s - "$TARGET_DIR/ffprobe" 2>/dev/null || true

          # Verify the binaries
          echo "Verifying FFmpeg binary..."
          file "$TARGET_DIR/ffmpeg"
          file "$TARGET_DIR/ffprobe"
          ls -lh "$TARGET_DIR/"

          echo "FFmpeg binaries ready for macOS ${ARCH}"

      # ---- Build web app (frontend) ----
      - name: Build frontend (Vite)
        run: pnpm build

      # ---- Build self-contained server bundle for Electron ----
      - name: Build Electron server bundle
        run: |
          node scripts/build-electron-server.mjs
          cp -r dist/public dist-electron/public

      # ---- Build Electron app ----
      - name: Build Electron app (.dmg)
        run: |
          npx electron-builder --mac --config electron-builder.config.cjs --${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- List output ----
      - name: List build output
        run: ls -lh release/

      # ---- Upload to Release ----
      - name: Upload .dmg to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ---- Upload as artifact (for manual/workflow_dispatch runs) ----
      - name: Upload .dmg as artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: ProRes-Converter-macOS-${{ matrix.arch }}
          path: release/*.dmg
          retention-days: 7
